services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gateway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway}
      POSTGRES_DB: ${POSTGRES_DB:-gateway}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gateway}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # redis-stack-server bundles the Query Engine (RediSearch) module used
    # for ANN vector search in the semantic cache (app/cache.py). Plain
    # redis:7-alpine also works -- the cache auto-detects the module isn't
    # loaded and falls back to a linear-scan similarity search instead.
    image: redis/redis-stack-server:7.4.0-v3
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://gateway:gateway@postgres:5432/gateway}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # PROVIDER selects the serving backend: "ollama" (default, CPU-friendly,
      # zero setup) or "vllm" (needs a GPU -- see the optional `vllm`
      # service below, profile "vllm").
      PROVIDER: ${PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://vllm:8000}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-llama3}
      ADMIN_KEY: ${ADMIN_KEY:-change-me-admin-key}
      MOCK_MODE: ${MOCK_MODE:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  # Optional GPU-backed serving engine, only started with
  # `docker compose --profile vllm up`. Not part of the default (CPU-only,
  # Ollama-backed) demo path. Set PROVIDER=vllm and DEFAULT_MODEL to match
  # VLLM_MODEL to route the gateway at it once it's up.
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["vllm"]
    command:
      - --model
      - ${VLLM_MODEL:-meta-llama/Llama-3.2-1B-Instruct}
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-4096}
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    ports:
      - "8001:8000"
    volumes:
      - vllm_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  vllm_cache:
